name: Update SPHEREx index

on:
  schedule:
    - cron: '17 6 * * 2'   # weekly, Tuesdays 06:17 UTC
  workflow_dispatch:
    inputs:
      refresh:
        description: 'Folders to re-fetch (space separated, or "all")'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build index
        run: python3 -u tools/build_index.py ${{ inputs.refresh && format('--refresh {0}', inputs.refresh) || '' }}
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          git diff --cached --quiet || (git commit -m "Update index" && git push)
